version: "3.8"

services:
  db:
    image: postgres:15-alpine
    container_name: scm_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-scm_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scm_pass}
      POSTGRES_DB: ${POSTGRES_DB:-supply_chain_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-scm_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: scm_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-scm_user}:${POSTGRES_PASSWORD:-scm_pass}@db:5432/${POSTGRES_DB:-supply_chain_db}
      DEBUG: "true"
      DATA_SEED: "20261022"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./exports:/app/exports
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
    name: scm_postgres_data

